<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Drift Pad</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#03030a;--p1:#080d18;--p2:#0d1426;--edge:#26405e;--txt:#cfe6ff;--dim:#5a728f;--cyan:#00f6ff;--mag:#ff2bd6;--lime:#b6ff3b;--amber:#ffb347;--cut:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px)}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:ui-monospace,Consolas,monospace;color:var(--txt);
    touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  #pad{position:fixed;inset:0;display:flex;flex-direction:column;letter-spacing:.2em;padding:max(22px,env(safe-area-inset-top)) 18px 6px;box-sizing:border-box;
    background-image:linear-gradient(var(--edge) 1px,transparent 1px),linear-gradient(90deg,var(--edge) 1px,transparent 1px);background-size:40px 40px}
  #pad::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,246,255,.08),transparent 60%),rgba(3,3,10,.82);pointer-events:none}
  @media (orientation:portrait){#pad{inset:auto;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}}
  .bar,.row2,.card{position:relative}
  .corner{position:absolute;width:8%;height:18%;border:2px solid var(--mag);pointer-events:none;filter:drop-shadow(0 0 6px var(--mag))}
  .corner.tl{left:12px;top:12px;border-right:0;border-bottom:0}.corner.bl{left:12px;bottom:12px;border-right:0;border-top:0}
  .corner.tr{right:12px;top:12px;border-left:0;border-bottom:0;border-color:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan))}
  .corner.br{right:12px;bottom:12px;border-left:0;border-top:0;border-color:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan))}
  .bar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 12%;font-size:10px;font-weight:700}
  .bar.foot{height:30px;border-top:1px solid #122033;background:rgba(5,10,20,.8);font-size:8px;color:#7a94b3;font-weight:400}
  .bar .tag{border:1px solid #1e334f;padding:2px 10px;font-size:9px;letter-spacing:.32em;opacity:.8}
  .bar b{color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
  .foot span{margin-right:14px}.foot i{font-style:normal;color:var(--txt);border:1px solid #3a5678;padding:1px 4px;margin-right:4px}
  .row2{flex:1;display:flex;align-items:stretch;padding:8px 10px 10px;gap:8px;min-height:0}
  .panel{position:relative;clip-path:var(--cut);background:linear-gradient(180deg,var(--p1),var(--p2));border:1.5px solid var(--c);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 25%,transparent),0 0 12px color-mix(in srgb,var(--c) 55%,transparent)}
  .panel.cyan{--c:var(--cyan)}.panel.mag{--c:var(--mag)}
  .panel .lbl{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);text-align:center;font-size:9px;font-weight:700;color:var(--c);letter-spacing:.3em;pointer-events:none;white-space:nowrap}
  .panel .lbl small{display:block;font-size:6px;color:var(--dim);margin-top:2px}
  .zone{width:30%;min-width:190px;overflow:hidden}
  .zone *{pointer-events:none}
  .ring,.knob{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%)}
  .ring{width:132px;height:132px;border:1.5px solid var(--edge);background:radial-gradient(circle,#0d1d33,#070f1d 70%);box-shadow:inset 0 0 0 1px #152a44,0 0 10px rgba(0,246,255,.15)}
  .zone.on .ring{border-color:var(--cyan);box-shadow:0 0 18px rgba(0,246,255,.5),inset 0 0 18px rgba(0,246,255,.1)}
  .knob{width:46px;height:46px;background:#0f223a;border:1.5px solid var(--cyan);box-shadow:0 0 10px var(--cyan),0 0 16px rgba(0,246,255,.4)}
  .zone.on .knob{background:var(--cyan);box-shadow:0 0 16px var(--cyan),0 0 28px rgba(0,246,255,.4)}
  .mid{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 10px;font-size:8px;font-weight:700;color:var(--dim)}
  .mid b{font-size:11px;text-align:center;margin-bottom:6px;text-shadow:0 0 10px currentColor}
  .mid small{font-size:7px}
  .meter{position:relative;height:8px;border:1px solid var(--edge);background:#080d18;margin-bottom:6px}
  .meter i,.meter u{position:absolute;left:0;top:0;height:100%;transition:width .1s linear}
  .meter i{background:var(--m);box-shadow:0 0 8px var(--m)}
  .meter u{background:var(--cyan);opacity:.6}
  .meter.hp{--m:var(--lime)}.meter.boost{--m:var(--amber)}
  .mid .nums{display:flex;justify-content:space-between}
  .mid em{font-style:normal;color:var(--txt);font-size:11px}
  .acts{width:44%;min-width:280px;display:flex;flex-direction:column;justify-content:space-evenly;padding:10px 14px}
  .acts *{pointer-events:none}.acts .btn,.acts .slide{pointer-events:auto}
  .hexes{display:flex;justify-content:space-between;align-items:center}
  .btn{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--txt);background:#131a2e;border:1.5px solid var(--edge);padding:10px 18px}
  .btn.on{color:#000;background:var(--b);border-color:var(--b);box-shadow:0 0 16px var(--b),0 0 28px color-mix(in srgb,var(--b) 40%,transparent)}
  .btn.hex{position:relative;width:32%;aspect-ratio:1;padding:0;border:0;color:var(--b);background:var(--b);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-size:11px;letter-spacing:.1em}
  .btn.hex span{position:absolute;inset:2px;clip-path:inherit;background:#131a2e;display:flex;align-items:center;justify-content:center}
  .btn.hex.on span,.btn.fire span{background:transparent}
  .btn.hex.on{color:#000}
  .btn.special{--b:var(--lime)}.btn.boost{--b:var(--amber)}
  .btn.fire{--b:var(--mag);color:#000}
  .btn.fire.on{background:#ff5de1}
  .slide{position:relative;padding-top:16px}
  .slide .lbl{position:static;transform:none;margin-bottom:6px;font-size:8px;color:var(--txt)}
  .track{position:relative;height:34px;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
    background:linear-gradient(180deg,var(--p1),var(--p2)) padding-box,repeating-linear-gradient(-45deg,transparent 0 22px,rgba(207,230,255,.14) 22px 23px);border:1.5px solid var(--edge);box-shadow:inset 0 0 0 1px #152a44}
  .slide.on .track{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,246,255,.5)}
  .track::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:var(--txt);box-shadow:0 0 8px var(--cyan)}
  .fill{position:absolute;top:2px;bottom:2px;left:50%;width:0;background:var(--cyan);box-shadow:0 0 10px var(--cyan);opacity:.9}
  .thumb{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--cyan);box-shadow:0 0 8px var(--cyan),0 0 18px var(--cyan)}
  .thumb::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
  .btn.menu{padding:2px 10px;font-size:14px;letter-spacing:0}
  .card{flex:1;margin:12px 10%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(16px,2.5vh);text-align:center}
  .card b{font-size:min(26px,6vh);text-shadow:0 0 14px currentColor}
  .card .art{width:min(28vh,160px);aspect-ratio:1;filter:drop-shadow(0 0 10px currentColor)}
  .card .ship{display:block;width:100%;aspect-ratio:530/450;background-image:url(/ships.png);background-repeat:no-repeat;background-size:289.81% 227.56%}
  .k0{background-position:21.57% 6.97%}.k1{background-position:78.53% 8.01%}
  .k2{background-position:1.19% 78.75%}.k3{background-position:49.9% 83.8%;transform:rotate(180deg)}.k4{background-position:97.81% 82.58%}
  .t1{filter:hue-rotate(35deg)}.t2{filter:hue-rotate(50deg)}
  .row{display:flex;gap:14px;align-items:center}
  .btn.big{--b:currentColor;padding:min(18px,3vh) 36px;font-size:18px}
  .btn.ready{background:currentColor}
  .btn.ready span{color:#03030a}
  .title{font-size:22px;color:var(--cyan);text-shadow:0 0 18px var(--cyan)}
</style>
</head>
<body>
<div id="pad"></div>
<script type="module" src="/build/Pad.js"></script>
</body>
</html>
