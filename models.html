<!doctype html>
<meta charset="utf-8">
<title>Ship model preview</title>
<style>
body{margin:0;background:#05060d;color:#cfe;font:12px monospace;overflow:hidden}
#ui{position:fixed;top:10px;left:10px;display:flex;flex-wrap:wrap;gap:6px;width:60vw;z-index:2}
#acts{position:fixed;bottom:10px;left:10px;display:flex;gap:6px;z-index:2}
button{background:#0a1226;color:#8ff;border:1px solid #2a4;padding:6px 10px;font:inherit;cursor:pointer}
button.on{background:#0f3;color:#000}
#info{position:fixed;top:10px;right:10px;text-align:right;opacity:.75;z-index:2}
</style>
<div id="ui"></div>
<div id="acts"></div>
<div id="info">drag = orbit · wheel = zoom</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

const MODELS = [
  ["phantom plain", "/models/phantom-plain.glb"], ["phantom tex", "/models/phantom-tex.glb"],
  ["shadow plain", "/models/shadow-plain.glb"], ["shadow tex", "/models/shadow-tex.glb"],
  ["star-a plain", "/models/star-a-plain.glb"], ["star-a tex", "/models/star-a-tex.glb"],
  ["star-b plain", "/models/star-b-plain.glb"], ["star-b tex", "/models/star-b-tex.glb"],
  ["star-c tex", "/models/star-c-tex.glb"],
];
const ACTS = ["idle", "thrust", "bank", "shoot", "damaged", "explode"];

const R = new THREE.WebGLRenderer({ antialias: true });
R.setSize(innerWidth, innerHeight); R.setPixelRatio(devicePixelRatio);
document.body.appendChild(R.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060d);
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
cam.position.set(3, 2, 4);
const ctl = new OrbitControls(cam, R.domElement);
scene.add(new THREE.GridHelper(20, 20, 0x10203a, 0x0a1224));
scene.add(new THREE.HemisphereLight(0x88ccff, 0x220044, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 2); key.position.set(3, 5, 2); scene.add(key);
const rim = new THREE.PointLight(0xff2bd6, 30, 20); rim.position.set(-3, 1, -3); scene.add(rim);

const rig = new THREE.Group(); scene.add(rig);
const ship = new THREE.Group(); rig.add(ship);
let radius = 1;

const glow = (c, o) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false });
const thruster = new THREE.Mesh(new THREE.ConeGeometry(0.18, 1, 12), glow(0x00f6ff, 0.9));
thruster.rotation.x = Math.PI / 2; rig.add(thruster);
const bullets = [];
const bulletGeo = new THREE.SphereGeometry(0.06, 8, 8);
const bulletMat = glow(0xffe066, 1);
const sparkCount = 300;
const sparkPos = new Float32Array(sparkCount * 3), sparkVel = new Float32Array(sparkCount * 3);
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute("position", new THREE.BufferAttribute(sparkPos, 3));
const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ color: 0xff7a2b, size: 0.09, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
sparks.visible = false; rig.add(sparks);

const loader = new GLTFLoader();
let act = "idle", t = 0, boom = 0, shotAt = 0;

function load(url) {
  ship.clear();
  loader.load(url, g => {
    const box = new THREE.Box3().setFromObject(g.scene);
    const size = box.getSize(new THREE.Vector3());
    const s = 2 / Math.max(size.x, size.y, size.z);
    g.scene.scale.setScalar(s);
    const c = box.getCenter(new THREE.Vector3()).multiplyScalar(-s);
    g.scene.position.copy(c);
    ship.add(g.scene);
    radius = Math.max(size.x, size.y, size.z) * s * 0.5;
    thruster.position.set(0, 0, radius + 0.5);
  }, undefined, e => console.error(e));
}

function burst() {
  for (let i = 0; i < sparkCount; i++) {
    sparkPos[i * 3] = sparkPos[i * 3 + 1] = sparkPos[i * 3 + 2] = 0;
    const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(1 + Math.random() * 4);
    sparkVel[i * 3] = v.x; sparkVel[i * 3 + 1] = v.y; sparkVel[i * 3 + 2] = v.z;
  }
  boom = 0; sparks.visible = true;
}

const ui = document.getElementById("ui"), acts = document.getElementById("acts");
MODELS.forEach(([name, url], i) => {
  const b = document.createElement("button");
  b.textContent = name; b.onclick = () => {
    [...ui.children].forEach(x => x.classList.remove("on")); b.classList.add("on"); load(url);
  };
  if (i === 0) b.classList.add("on");
  ui.append(b);
});
ACTS.forEach((a, i) => {
  const b = document.createElement("button");
  b.textContent = a; b.onclick = () => {
    [...acts.children].forEach(x => x.classList.remove("on")); b.classList.add("on");
    act = a; t = 0; sparks.visible = false; ship.visible = true;
    if (a === "explode") burst();
  };
  if (i === 0) b.classList.add("on");
  acts.append(b);
});
load(MODELS[0][1]);

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05); t += dt;
  rig.rotation.set(0, 0, 0); rig.position.set(0, 0, 0);
  thruster.visible = false; ship.traverse(o => { if (o.material) o.material.opacity ??= 1; });

  if (act === "idle") rig.rotation.y = t * 0.5;
  if (act === "thrust") {
    rig.rotation.y = t * 0.5;
    thruster.visible = true;
    thruster.scale.set(1, 1 + Math.sin(t * 30) * 0.25, 1);
    thruster.material.opacity = 0.7 + Math.random() * 0.3;
  }
  if (act === "bank") { rig.rotation.y = t * 0.8; rig.rotation.z = Math.sin(t * 1.2) * 0.9; }
  if (act === "shoot") {
    rig.rotation.y = Math.sin(t * 0.4) * 0.6;
    if (t - shotAt > 0.12) {
      shotAt = t;
      for (const s of [-radius * 0.6, radius * 0.6]) {
        const b = new THREE.Mesh(bulletGeo, bulletMat);
        b.position.set(s, 0, -radius);
        b.userData.dir = new THREE.Vector3(0, 0, -1).applyEuler(rig.rotation);
        b.position.applyEuler(rig.rotation);
        scene.add(b); bullets.push(b);
      }
    }
  }
  if (act === "damaged") {
    rig.rotation.y = t * 0.5; rig.rotation.z = Math.sin(t * 9) * 0.15;
    rig.position.y = Math.sin(t * 17) * 0.05;
    const hit = Math.sin(t * 25) > 0.4;
    ship.traverse(o => { if (o.isMesh) o.material.emissive?.setHex(hit ? 0xff2200 : 0x000000); });
    if (!sparks.visible) { burst(); sparks.visible = true; }
    if (boom > 0.8) burst();
  } else {
    ship.traverse(o => { if (o.isMesh) o.material.emissive?.setHex(0x000000); });
  }
  if (act === "explode") {
    boom += dt;
    ship.visible = boom < 0.08;
    if (boom > 2) burst();
  }
  if (sparks.visible) {
    boom += act === "explode" ? 0 : dt;
    for (let i = 0; i < sparkCount; i++) {
      sparkPos[i * 3] += sparkVel[i * 3] * dt;
      sparkPos[i * 3 + 1] += sparkVel[i * 3 + 1] * dt;
      sparkPos[i * 3 + 2] += sparkVel[i * 3 + 2] * dt;
    }
    sparkGeo.attributes.position.needsUpdate = true;
    sparks.material.opacity = Math.max(0, 1 - boom / 2);
  }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.position.addScaledVector(b.userData.dir, 25 * dt);
    if (b.position.length() > 30) { scene.remove(b); bullets.splice(i, 1); }
  }
  if (act !== "shoot") { bullets.forEach(b => scene.remove(b)); bullets.length = 0; }

  ctl.update(); R.render(scene, cam); requestAnimationFrame(frame);
}
frame();
addEventListener("resize", () => {
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  R.setSize(innerWidth, innerHeight);
});
</script>
