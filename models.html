<!doctype html>
<meta charset="utf-8">
<title>Ship model preview</title>
<style>
body{margin:0;background:#05060d;color:#cfe;font:12px monospace;overflow:hidden}
#ui{position:fixed;top:10px;left:10px;display:flex;flex-wrap:wrap;gap:6px;width:60vw;z-index:2}
#acts{position:fixed;bottom:10px;left:10px;display:flex;gap:6px;z-index:2}
#cols{position:fixed;bottom:10px;right:10px;display:flex;gap:6px;z-index:2}
#cols button{width:28px;height:28px;padding:0;border-color:#123}
#cols button.on{outline:2px solid #fff}
button{background:#0a1226;color:#8ff;border:1px solid #2a4;padding:6px 10px;font:inherit;cursor:pointer}
button.on{background:#0f3;color:#000}
#info{position:fixed;top:10px;right:10px;text-align:right;opacity:.75;z-index:2}
#tune{position:fixed;top:70px;max-height:calc(100vh - 140px);overflow:auto;right:10px;width:210px;background:#0a1226cc;border:1px solid #2a4;padding:8px;z-index:2}
#tune label{display:flex;align-items:center;gap:6px;margin:3px 0}
#tune span{width:74px}#tune b{width:44px;text-align:right;color:#0f3;font-weight:normal}
#tune input{flex:1;width:0;accent-color:#0f3}
#save{position:fixed;top:36px;right:10px;z-index:3}
#tune hr{border:0;border-top:1px solid #234;margin:6px 0}
</style>
<div id="ui"></div>
<div id="acts"></div>
<div id="cols"></div>
<div id="tune"></div>
<button id="save">SAVE TWEAKS</button>
<div id="info"><button id="top">TOP VIEW</button> <button id="spin" class="on">SPIN</button><br>drag = orbit · wheel = zoom</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

const MODELS = [
  ["phantom", "/models/phantom.glb", 0],
  ["shadow", "/models/shadow.glb", -Math.PI / 2],
  ["star-a", "/models/star-a.glb", -Math.PI / 2],
  ["star-b", "/models/star-b.glb", -Math.PI / 2],
];
const ACTS = ["idle", "thrust", "bank", "shoot", "damaged", "explode"];
const O = { yaw: 0, pitch: 0, roll: 0 };
const ORI = {};
let shipName = "";
const P = {
  jetLen: 0.9, jetRad: 0.14, jetX: 0.3, jetZ: 1.22, jetFlicker: 0.25,
  stretch: 1, width: 1, height: 1,
  metalness: 0.6, roughness: 0.4, emissive: 0, wireframe: 0,
  fireRate: 0.12, bulletSpeed: 25, bulletSize: 0.06, muzzleX: 0.6, muzzleZ: 1,
};
const TEAM = [0x00f6ff, 0xff2bd6, 0x7cff3a, 0xffb300, 0xff6a00];
let team = TEAM[0];

const R = new THREE.WebGLRenderer({ antialias: true });
R.setSize(innerWidth, innerHeight); R.setPixelRatio(devicePixelRatio);
document.body.appendChild(R.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060d);
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
cam.position.set(3, 2, 4);
const ctl = new OrbitControls(cam, R.domElement);
scene.add(new THREE.GridHelper(20, 20, 0x10203a, 0x0a1224));
scene.add(new THREE.HemisphereLight(0x88ccff, 0x220044, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 2); key.position.set(3, 5, 2); scene.add(key);
const rim = new THREE.PointLight(0xff2bd6, 30, 20); rim.position.set(-3, 1, -3); scene.add(rim);

const rig = new THREE.Group(); scene.add(rig);
const ship = new THREE.Group(); rig.add(ship);
let radius = 1;

const glow = (c, o) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false });
const jets = [0, 1].map(() => {
  const m = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 12), glow(0x00f6ff, 0.9));
  m.rotation.x = -Math.PI / 2; rig.add(m); return m;
});
const placeJets = () => jets.forEach((j, i) => j.position.set((i ? 1 : -1) * radius * P.jetX, 0, P.jetZ));
const bullets = [];
const bulletGeo = new THREE.SphereGeometry(0.06, 8, 8);
const bulletMat = glow(0xffe066, 1);
const sparkCount = 300;
const sparkPos = new Float32Array(sparkCount * 3), sparkVel = new Float32Array(sparkCount * 3);
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute("position", new THREE.BufferAttribute(sparkPos, 3));
const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ color: 0xff7a2b, size: 0.09, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
sparks.visible = false; rig.add(sparks);

const loader = new GLTFLoader();
let act = "idle", t = 0, boom = 0, shotAt = 0;

function applyMat() {
  ship.traverse(o => {
    if (!o.isMesh) return;
    o.material.metalness = P.metalness;
    o.material.roughness = P.roughness;
    o.material.emissive?.setHex(team);
    o.material.emissiveIntensity = P.emissive;
    o.material.wireframe = !!P.wireframe;
  });
}

let current = null;

function fit() {
  if (!current) return;
  ship.clear();
  current.rotation.set(O.pitch, O.yaw, O.roll);
  const box = new THREE.Box3().setFromObject(current);
  const size = box.getSize(new THREE.Vector3());
  const s = 2 / size.z;
  const holder = new THREE.Group();
  holder.scale.set(s * P.width, s * P.height, s * P.stretch);
  holder.position.copy(box.getCenter(new THREE.Vector3()).multiplyScalar(-s));
  holder.add(current);
  ship.add(holder);
  radius = size.x * s * P.width * 0.5;
  placeJets();
  applyMat();
}

function load(url, yaw, name) {
  ship.clear(); current = null; shipName = name;
  Object.assign(O, { yaw, pitch: 0, roll: 0 }, ORI[name]); syncOri();
  loader.load(url, g => { current = g.scene; fit(); }, undefined, e => console.error(e));
}

function burst() {
  for (let i = 0; i < sparkCount; i++) {
    sparkPos[i * 3] = sparkPos[i * 3 + 1] = sparkPos[i * 3 + 2] = 0;
    const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(1 + Math.random() * 4);
    sparkVel[i * 3] = v.x; sparkVel[i * 3 + 1] = v.y; sparkVel[i * 3 + 2] = v.z;
  }
  boom = 0; sparks.visible = true;
}

const ui = document.getElementById("ui"), acts = document.getElementById("acts");
MODELS.forEach(([name, url, yaw], i) => {
  const b = document.createElement("button");
  b.textContent = name; b.onclick = () => {
    [...ui.children].forEach(x => x.classList.remove("on")); b.classList.add("on"); load(url, yaw, name);
  };
  if (i === 0) b.classList.add("on");
  ui.append(b);
});
ACTS.forEach((a, i) => {
  const b = document.createElement("button");
  b.textContent = a; b.onclick = () => {
    [...acts.children].forEach(x => x.classList.remove("on")); b.classList.add("on");
    act = a; t = 0; sparks.visible = false; ship.visible = true;
    if (a === "explode") burst();
  };
  if (i === 0) b.classList.add("on");
  acts.append(b);
});
const cols = document.getElementById("cols");
TEAM.forEach((c, i) => {
  const b = document.createElement("button");
  b.style.background = "#" + c.toString(16).padStart(6, "0");
  b.onclick = () => {
    [...cols.children].forEach(x => x.classList.remove("on")); b.classList.add("on");
    team = c; jets.forEach(j => j.material.color.setHex(c)); applyMat();
  };
  if (i === 0) b.classList.add("on");
  cols.append(b);
});
let spin = true;
const spinBtn = document.getElementById("spin");
spinBtn.onclick = () => { spin = !spin; spinBtn.classList.toggle("on", spin); };
document.getElementById("top").onclick = () => {
  cam.position.set(0, 5, 0.001); ctl.target.set(0, 0, 0); ctl.update();
};
const oriBox = document.createElement("div");
const oriUi = ["yaw", "pitch", "roll"].map(k => {
  const l = document.createElement("label");
  l.innerHTML = `<span>${k}°</span><input type=range min=-180 max=180 step=5 value=0><b>0</b>`;
  const [inp, out] = [l.querySelector("input"), l.querySelector("b")];
  inp.oninput = () => {
    O[k] = +inp.value * Math.PI / 180; out.textContent = inp.value;
    (ORI[shipName] ??= {})[k] = O[k]; fit();
  };
  oriBox.append(l);
  return [k, inp, out];
});
function syncOri() {
  for (const [k, inp, out] of oriUi) {
    const deg = Math.round(O[k] * 180 / Math.PI);
    inp.value = deg; out.textContent = deg;
  }
}

const RANGES = {
  jetLen: [0.2, 3, 0.05], jetRad: [0.03, 0.5, 0.01], jetX: [0, 1, 0.02],
  jetZ: [0.5, 2.5, 0.02], jetFlicker: [0, 1, 0.05],
  stretch: [0.4, 2.5, 0.05], width: [0.4, 2.5, 0.05], height: [0.2, 3, 0.05],
  metalness: [0, 1, 0.05], roughness: [0, 1, 0.05], emissive: [0, 1, 0.05], wireframe: [0, 1, 1],
  fireRate: [0.03, 0.6, 0.01], bulletSpeed: [5, 80, 1],
  bulletSize: [0.02, 0.3, 0.01], muzzleX: [0, 1.2, 0.02], muzzleZ: [0, 2, 0.02],
};
const tune = document.getElementById("tune");
tune.append(oriBox, document.createElement("hr"));
const paramUi = [];
Object.entries(RANGES).forEach(([k, [min, max, step]], i) => {
  if (k === "stretch" || k === "fireRate") tune.append(document.createElement("hr"));
  const l = document.createElement("label");
  l.innerHTML = `<span>${k}</span><input type=range min=${min} max=${max} step=${step} value=${P[k]}><b>${P[k]}</b>`;
  const [inp, out] = [l.querySelector("input"), l.querySelector("b")];
  inp.oninput = () => {
    P[k] = +inp.value; out.textContent = inp.value;
    placeJets(); applyMat(); if (k === "stretch" || k === "width" || k === "height") fit();
  };
  paramUi.push([k, inp, out]);
  tune.append(l);
});
function syncParams() {
  for (const [k, inp, out] of paramUi) { inp.value = P[k]; out.textContent = P[k]; }
  placeJets();
}
load(MODELS[0][1], MODELS[0][2], MODELS[0][0]);

document.getElementById("save").onclick = async (e) => {
  await fetch("/__model-tune", { method: "POST", body: JSON.stringify({ params: P, orientation: ORI }, null, 2) });
  e.target.textContent = "SAVED"; setTimeout(() => (e.target.textContent = "SAVE TWEAKS"), 1200);
};

fetch("/models/tune.json").then(r => r.ok && r.json()).then(saved => {
  if (!saved) return;
  Object.assign(P, saved.params); Object.assign(ORI, saved.orientation);
  syncParams(); applyMat();
  const m = MODELS.find(([n]) => n === shipName);
  load(m[1], m[2], m[0]);
}).catch(() => {});

window.V = { THREE, P, O, ORI, cam, ctl, rig, ship, load, MODELS };

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05); t += dt;
  rig.rotation.set(0, 0, 0); rig.position.set(0, 0, 0);
  jets.forEach(j => j.visible = false);

  if (act === "idle") rig.rotation.y = t * 0.5;
  if (act === "thrust") {
    rig.rotation.y = t * 0.5;
    jets.forEach(j => {
      j.visible = true;
      const f = 1 + Math.sin(t * 30) * P.jetFlicker;
      j.scale.set(P.jetRad, P.jetLen * f, P.jetRad);
      j.material.opacity = 0.7 + Math.random() * 0.3;
    });
  }
  if (act === "bank") { rig.rotation.y = t * 0.8; rig.rotation.z = Math.sin(t * 1.2) * 0.9; }
  if (act === "shoot") {
    rig.rotation.y = Math.sin(t * 0.4) * 0.6;
  }
  if (!spin) rig.rotation.y = 0;
  if (act === "shoot") {
    if (t - shotAt > P.fireRate) {
      shotAt = t;
      for (const s of [-radius * P.muzzleX, radius * P.muzzleX]) {
        const b = new THREE.Mesh(bulletGeo, bulletMat);
        b.scale.setScalar(P.bulletSize / 0.06);
        b.position.set(s, 0, -P.muzzleZ);
        b.userData.dir = new THREE.Vector3(0, 0, -1).applyEuler(rig.rotation);
        b.position.applyEuler(rig.rotation);
        scene.add(b); bullets.push(b);
      }
    }
  }
  if (act === "damaged") {
    rig.rotation.y = t * 0.5; rig.rotation.z = Math.sin(t * 9) * 0.15;
    rig.position.y = Math.sin(t * 17) * 0.05;
    const hit = Math.sin(t * 25) > 0.4;
    ship.traverse(o => { if (o.isMesh) { o.material.emissive?.setHex(hit ? 0xff2200 : team); o.material.emissiveIntensity = hit ? 0.8 : P.emissive; } });
    if (!sparks.visible) { burst(); sparks.visible = true; }
    if (boom > 0.8) burst();
  } else {
    ship.traverse(o => { if (o.isMesh) o.material.emissiveIntensity = P.emissive; });
  }
  if (act === "explode") {
    boom += dt;
    ship.visible = boom < 0.08;
    if (boom > 2) burst();
  }
  if (sparks.visible) {
    boom += act === "explode" ? 0 : dt;
    for (let i = 0; i < sparkCount; i++) {
      sparkPos[i * 3] += sparkVel[i * 3] * dt;
      sparkPos[i * 3 + 1] += sparkVel[i * 3 + 1] * dt;
      sparkPos[i * 3 + 2] += sparkVel[i * 3 + 2] * dt;
    }
    sparkGeo.attributes.position.needsUpdate = true;
    sparks.material.opacity = Math.max(0, 1 - boom / 2);
  }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.position.addScaledVector(b.userData.dir, P.bulletSpeed * dt);
    if (b.position.length() > 30) { scene.remove(b); bullets.splice(i, 1); }
  }
  if (act !== "shoot") { bullets.forEach(b => scene.remove(b)); bullets.length = 0; }

  ctl.update(); R.render(scene, cam); requestAnimationFrame(frame);
}
frame();
addEventListener("resize", () => {
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  R.setSize(innerWidth, innerHeight);
});
</script>
